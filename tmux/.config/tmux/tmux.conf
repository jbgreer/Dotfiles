# tmux.conf
# 2026-01-19 jbgreer annotations on options, etc.

# default-terminal  [terminal]
# default: value of TERM variable
# must be set to screen OR tmux or a derivative of them
set  -g default-terminal "tmux-256color"

# base-index [index]; default 0
# set base index from which an unused index should be searched
# when a new window is created 
set  -g base-index 0

# pane-base-index [index]; default 0
# similar to base-index, but used to set index for pane
setw -g pane-base-index 0

# default-shell [path]
# default from SHELL environment variable OR getpwuid(3) OR /bin/sh
# specify the default login shell for new windows if default-command is empty
# must be a full path.
set  -g default-shell "/bin/zsh"

# status-keys [vi | emacs]
# default emacs unless VISUAL or EDITOR environment variables are set 
# and contain vi
# use vi or emacs-style kiy bindings in the status line
set -g status-keys vi

# mode-keys [vi | emacs]
# default emacs
# default emacs unless VISUAL or EDITOR environment variables are set 
# and contain vi
# use vi or emacs-style key bindings in copy mode
set -g mode-keys   vi

# rebind tmux prefix key from C-b (default) to  C-a
unbind C-b
set -g prefix C-a
bind -N "Send the prefix key through to the application" \
  C-a send-prefix

# mouse [on | off]; default off
# when enabled allows mouse events:
#   WheelUp	WheelDown	
#   MouseDown1	MouseUp1	MouseDrag1	MouseDragEnd1
#   MouseDown2	MouseUp2	MouseDrag2	MouseDragEnd2
#   MouseDown3	MouseUp3	MouseDrag3	MouseDragEnd3
#   SecondClick1	SecondClick2	SecondClick3
#   DoubleClick1	DoubleClick2	DoubleClick3
#   TripleClick1	TripleClick2	TripleClick3
#
# to be bound as mode-keys. The name of each key is a mouse events and a 
# location suffix:
#   Pane	the contents of a pane
#   Border	a pane border
#   Status	the status line window list
#   StatusLeft	the left part of the status line
#   StatusRight	the right part of the status line
#   StatusDefault	any other part of the status line
#   ScrollbarSlider	the scrollbar slider
#   ScrollbarUp	above the scrollbar slider
#   ScrollbarDown	below the scrollbar slider
# e.g.  MouseDown1Status
set  -g mouse             on

# focus-even [on | off]
# when enabled focus events are requested from the terminal if supported 
# and passed through to apps
set  -g focus-events      off

# agressive-reszie [on | off]
# when enabled, resize the window to the size of the smallest or largest
# session for which it is the current window, rather than the session 
# to which it is attached.
# Good for full-screen programs supporting SIGWINCH; poor for shells
setw -g aggressive-resize off

# clock-mode-style [12 | 24 | 12-with-seconds | 24-with-seconds]
# set clock hour format, whether to display seconds
setw -g clock-mode-style  24

# escape-time [millisecomds]
# set the time in milliseconds fow which tmux waits after <ESC>
# to determine if it is part of a function or meta key sequence
set  -s escape-time       500

# history-limit [lines]
# set the maximum number of lines held in window history
set  -g history-limit     2000

# status-position [top | bottom]
# set position of the status line
set -g status-position top

# split-window: create a new pane by splitting target pane
# change vertical split key from % to |
unbind %
bind | split-window -h
# change hortizontal split key from " to -
unbind '"'
bind - split-window -v

# resize of panel
# j resize pane by 5 lines down
bind -r j resize-pane -D 5
# k resize pane by 5 lines up
bind -r k resize-pane -U 5
# l resize pane by 5 lines right
bind -r l resize-pane -R 5
# h resize pane by 5 lines left
bind -r h resize-pane -L 5
# m toggle resizing of pane between zoomed and unzoomed
bind -r m resize-pane -Z

# start selecting text with v
bind-key -T copy-mode-vi 'v' send -X begin-selection
# copy text with y
bind-key -T copy-mode-vi 'y' send -X copy-selection
# don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# catppuccin theme based 
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_status_modules_right "directory user host session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{pane_current_path}"

# install catppuccin theme
set -g @plugin 'catppuccin/tmux#v2.1.2'

# install tmux plugin manager tpm
set -g @plugin 'tmux-plugins/tpm'

# activate tpm plugins
run '~/.config/tmux/plugins/tpm/tpm'
