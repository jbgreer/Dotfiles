# .tmux.conf

set -g default-terminal "screen-256color"

# use vi key motions and enable mouse use
set-window-option -g mode-keys vi
set -g mouse on

# unset default prefix and set to C-b
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# change vertical split key to |
unbind %
bind | split-window -h 

# change hortizontal split key to -
unbind '"'
bind - split-window -v

# enable easy resource of config file
unbind r
bind r source-file ~/.tmux.conf

# resize of panel
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

# start selecting text with "v"
bind-key -T copy-mode-vi 'v' send -X begin-selection 
# copy text with "y"
bind-key -T copy-mode-vi 'y' send -X copy-selection 
# don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane 

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# tpm plugins
# vim-tmux-navigator: move between vim panes and tmux splits
set -g @plugin 'christoomey/vim-tmux-navigator'
# ctl-h left
# ctl-j down
# ctl-k up
# ctl-l right
# ctl-\ previous split

# list of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavour 'mocha'

run '~/.tmux/plugins/tpm/tpm'
